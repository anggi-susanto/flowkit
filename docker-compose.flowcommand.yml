services:
  flowcommand:
    build:
      context: .
      dockerfile: Dockerfile.flowcommand
    container_name: flowcommand
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLOW_AGENT_DIR: /app/runtime
      API_HOST: 0.0.0.0
      API_PORT: 8100
      WS_HOST: 0.0.0.0
      WS_PORT: 9222
    ports:
      - "8100:8100"
      - "9222:9222"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - flowcommand-output:/app/output
      - flowcommand-runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  flowcommand-output:
  flowcommand-runtime:
